name: Build Hail freeze tabs APK
on:
  push:
    branches: [codex/hail-freeze-tabs-apk]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply the freeze tabs source changes
        run: |
          base64 --decode <<'PATCH' | gzip -dc > /tmp/hail-freeze-tabs.patch
          
          PATCH
          echo "503d7fd3eb2d1a1dfc92424a18e7f5dc295f03f99b98e9f338c17985b6ed1e92  /tmp/hail-freeze-tabs.patch" | sha256sum -c
          git apply --check /tmp/hail-freeze-tabs.patch
          git apply /tmp/hail-freeze-tabs.patch
      - name: Build release APK and run unit tests
        run: ./gradlew :app:assembleRelease :app:testDebugUnitTest
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hail-freeze-tabs
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
